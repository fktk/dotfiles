gui:
  language: 'ja'
os:
  edit: "nvim -- {{filename}}"
  editPreset: "nvim"

git:
  diffRenderers:
    - command: >-
        delta
        --dark
        --paging=never
        --side-by-side
        --hyperlinks
        --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
        --syntax-theme=zenburn
    - type: rawGit
      name: default
