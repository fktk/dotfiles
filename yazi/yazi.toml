[mgr]
ratio = [1, 3, 4]
show_hidden = true
sort_by = "natural"
sort_sensitive = false
sort_dir_first = true
linemode = "size_and_mtime"
show_symlink = true

[preview]
image_delay = 30

plugin.prepend_previewers = [
  { url = '*.sqlite3', run = 'preview-sqlite' },
  { mime = 'application/sqlite3', run = 'preview-sqlite' },
]
